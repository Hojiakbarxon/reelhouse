<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />

    <title>Reelhouse — Stream movies online</title>
    <meta
      name="description"
      content="Reelhouse is a movie streaming platform: browse a growing catalog by category, read reviews, explore cast and watch free and premium films."
    />
    <meta name="keywords" content="movies, streaming, watch movies online, film catalog, movie reviews, cast, Reelhouse" />
    <meta name="author" content="Reelhouse" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (link previews on Telegram, Facebook, LinkedIn, ...) -->
    <meta property="og:site_name" content="Reelhouse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reelhouse — Stream movies online" />
    <meta
      property="og:description"
      content="Browse a growing movie catalog by category, read reviews, explore cast and watch free and premium films."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reelhouse — Stream movies online" />
    <meta
      name="twitter:description"
      content="Browse a growing movie catalog by category, read reviews, explore cast and watch free and premium films."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Reelhouse",
        "description": "Movie streaming platform with free and premium films."
      }
    </script>
  </head>
  <body>
    <noscript>Reelhouse needs JavaScript enabled to browse and stream movies.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
